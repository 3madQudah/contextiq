# Serves the Vite production build (frontend/dist/) and makes react-router-dom's
# client-side routing work on a hard refresh / direct URL visit (e.g. loading
# /app/chat/42 directly) -- without the fallback below, nginx would look for a
# literal file at that path, not find one, and return its own 404 instead of
# handing the request to index.html so the SPA's router can take over.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built asset filenames with a content hash
    # (dist/assets/*-<hash>.js), so it's safe to cache these aggressively --
    # a changed file is a changed URL, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lightweight target for the container HEALTHCHECK / compose
    # depends_on:condition without depending on index.html parsing correctly.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
